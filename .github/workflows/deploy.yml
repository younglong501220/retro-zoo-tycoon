name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

# 設定 GitHub Pages 所需的權限
permissions:
  contents: read
  pages: write
  id-token: write

# 避免多個建置任務衝突
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 使用 Node.js 22 版本，移除強制依賴 package-lock.json 的快取設定
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 使用 --legacy-peer-deps 徹底避免套件版本衝突，無論是否有 lockfile 都能順暢安裝
      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build project
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
